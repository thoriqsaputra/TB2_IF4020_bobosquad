version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tb2-postgres
    environment:
      POSTGRES_DB: tb2_crypto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tb2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: tb2-ipfs
    ports:
      - "4001:4001" # Swarm
      - "5001:5001" # API
      - "8080:8080" # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    networks:
      - tb2-network

  # Backend - Node.js + Express
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tb2-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tb2_crypto
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - RPC_URL=${RPC_URL:-https://sepolia.infura.io/v3/YOUR_INFURA_KEY}
      - IPFS_GATEWAY=http://ipfs:8080
      - JWT_SECRET=your-secret-key-change-in-production
      - PORT=5000
    volumes:
      - ./Backend:/app
      - /app/node_modules
      - ./shared-config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    networks:
      - tb2-network
    restart: unless-stopped

  # Frontend - React + Vite
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tb2-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - VITE_RPC_URL=${RPC_URL:-https://sepolia.infura.io/v3/YOUR_INFURA_KEY}
      - VITE_IPFS_GATEWAY=http://localhost:8080
      - VITE_BACKEND_URL=http://localhost:5000
      - VITE_NETWORK=sepolia
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - ./shared-config:/app/config:ro
    depends_on:
      - backend
    networks:
      - tb2-network
    restart: unless-stopped

  # Smart Contract Deployer (One-time service)
  contract-deployer:
    build:
      context: ./SmartContract
      dockerfile: Dockerfile.deploy
    container_name: tb2-contract-deployer
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RPC_URL=${RPC_URL:-https://sepolia.infura.io/v3/YOUR_INFURA_KEY}
      - DEPLOY_MODE=${DEPLOY_MODE:-reuse}
      - FORCE_DEPLOY=${FORCE_DEPLOY:-false}
    volumes:
      - ./SmartContract/deployment.json:/app/deployment.json
      - ./shared-config:/shared-config
    networks:
      - tb2-network
    profiles:
      - deploy # Only run with: docker-compose --profile deploy up contract-deployer
    command: node scripts/deploy-smart.js

networks:
  tb2-network:
    driver: bridge

volumes:
  postgres_data:
  ipfs_data:
