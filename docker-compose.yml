version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tb2-postgres
    environment:
      POSTGRES_DB: tb2_crypto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tb2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/kubo:release
    container_name: tb2-ipfs
    ports:
      - "4001:4001" # Swarm
      - "5001:5001" # API
      - "8080:8080" # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    networks:
      - tb2-network

  # Backend - Node.js + Express
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tb2-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tb2_crypto
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - IPFS_GATEWAY=http://ipfs:8080
      - JWT_SECRET=your-secret-key-change-in-production
      - PORT=3000
    volumes:
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    networks:
      - tb2-network
    restart: unless-stopped

  # Frontend - React + Vite
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tb2-frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tb2-network
    restart: unless-stopped

networks:
  tb2-network:
    driver: bridge

volumes:
  postgres_data:
  ipfs_data:
